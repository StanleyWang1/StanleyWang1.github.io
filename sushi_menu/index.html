<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#711d1d">
  <title>Sushi Menu</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #fff;
    }

    .menu {
      display: block;
      width: 100%;
      height: auto;
    }

    .language-toggle {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 1;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 7px;
      color: #fff;
      background: rgba(113, 29, 29, 0.92);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .language-toggle:hover {
      background: #5f1717;
    }

    .language-toggle:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.95);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <img
      id="menu"
      class="menu"
      src="japanese_menu.png"
      alt="Japanese sushi menu"
      width="941"
      height="1672"
    >
  </main>

  <button
    id="language-toggle"
    class="language-toggle"
    type="button"
    aria-label="Switch menu to English"
  >English</button>

  <script>
    const menu = document.getElementById("menu");
    const toggle = document.getElementById("language-toggle");
    let language = "ja";

    toggle.addEventListener("click", () => {
      language = language === "ja" ? "en" : "ja";
      const isJapanese = language === "ja";

      menu.src = isJapanese ? "japanese_menu.png" : "english_menu.png";
      menu.alt = isJapanese ? "Japanese sushi menu" : "English sushi menu";
      toggle.textContent = isJapanese ? "English" : "日本語";
      toggle.setAttribute(
        "aria-label",
        isJapanese ? "Switch menu to English" : "メニューを日本語に切り替える"
      );
      document.documentElement.lang = language;
    });
  </script>
</body>
</html>
